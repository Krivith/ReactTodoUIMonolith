trigger: none
pool: self hosted

stages:
  - stage: Build
    displayName: Build_Stage
    jobs:
      - job: Build_Job
        displayName: npm_install
        steps:
        - task: NodeTool@0
          displayName: Install Node.js
          inputs:
            versionSource: 'spec'
            versionSpec: '16.x'

        - task: PowerShell@2
          displayName: Install Dependencies
          inputs:
            targetType: 'inline'
            script: 'npm install'

        - task: PowerShell@2
          displayName: Build the Project
          inputs:
            targetType: 'inline'
            script: 'npm run build'

        - task: PublishPipelineArtifact@1
          inputs:
            targetPath: '$(System.DefaultWorkingDirectory)'
            artifact: 'todo_Frontend'
            publishLocation: 'pipeline'